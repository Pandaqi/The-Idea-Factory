<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="A database of creative inspiration for those looking for ideas.">
    <link rel="shortcut icon" type="image/x-icon" href="/css/favicon-colored.ico" />
    <title>{{ .Title }} | Factory of Ideas</title>
    {{ $opts := dict "transpiler" "dartsass" "targetPath" "css/style.css" }}
    {{ with resources.Get "sass/index.scss" }}
        {{ $style := . | css.Sass $opts }}
        <link rel="preload" href="{{ $style.RelPermalink }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
        <noscript><link rel="stylesheet" href="{{ $style.RelPermalink }}"></noscript>
    {{ end }}
</head>
