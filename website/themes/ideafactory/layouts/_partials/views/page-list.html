{{ $pages := .pages }}
<ul class="remove-list-styles flex-center flex-equal-size">
{{ range $pages }}
    <li class="thought-bubble limit-width-small maximize-width-small-screen hover_popup">
        <a href="{{ .RelPermalink }}" class="remove-link-styles padding-small">
            <h2 class="margin-none text-center">{{ .Title }}</h2>
            {{ partial "views/metadata-list-small" . }}
            {{ $summary := .Content | plainify | truncate 150 }}
            <p>{{ $summary }}</p>
        </a>
    </li>
{{ end }}
</ul>
